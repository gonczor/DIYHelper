[project]
name = "diyhelper"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16.4",
    "beautifulsoup4>=4.13.4",
    "dishka>=1.6.0",
    "fastapi>=0.141.1",
    "google-genai>=2.16.0",
    "google-cloud-storage>=3.2.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.10.1",
    "python-dotenv>=1.1.0",
    "sqlalchemy[asyncio]>=2.0.41",
    "structlog>=25.4.0",
    "asyncpg>=0.30.0",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "mypy>=1.19.1",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-vcr>=1.0.2",
    "ruff>=0.15.5",
]

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["migrations/versions/"]

[[tool.mypy.overrides]]
module = ["google.cloud.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["test"]
